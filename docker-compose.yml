services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jornada-api-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - db
      - mailpit
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8030
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: jornada
      DB_USERNAME: jornada
      DB_PASSWORD: secret
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@jornada.local
      MAIL_FROM_NAME: Jornada Capacitacao
    networks:
      - jornada

  nginx:
    image: nginx:1.27-alpine
    container_name: jornada-api-nginx
    restart: unless-stopped
    ports:
      - "8030:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jornada

  db:
    image: postgres:17-alpine
    container_name: jornada-api-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jornada
      POSTGRES_USER: jornada
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jornada

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: jornada-api-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - jornada

  swagger:
    image: swaggerapi/swagger-ui:v5.18.2
    container_name: jornada-api-swagger
    restart: unless-stopped
    ports:
      - "8031:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
      WITH_CREDENTIALS: "true"
    volumes:
      - ./docs/openapi.yaml:/docs/openapi.yaml:ro
    networks:
      - jornada

volumes:
  postgres-data:
  vendor:

networks:
  jornada:
    driver: bridge
