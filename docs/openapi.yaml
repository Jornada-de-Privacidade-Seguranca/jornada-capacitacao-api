  /users/{user}/journeys:
    get:
      tags:
        - Journeys
      summary: Lista jornadas paginadas de um usuario
      description: Retorna as jornadas do usuario informado, da mais recente para a mais antiga. Usuarios comuns so podem consultar as proprias jornadas; administradores podem consultar jornadas de qualquer usuario. Para testar no Swagger local, faca login antes em /auth/login usando o token retornado por /auth/csrf-token; nao cole manualmente o cookie no botao Authorize.
      operationId: listUserJourneys
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: page
          in: query
          required: false
          description: Pagina atual.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Quantidade de registros por pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
        - name: status
          in: query
          required: false
          description: Filtra pela situacao da jornada.
          schema:
            type: string
            enum:
              - completed
              - ongoing
          example: ongoing
        - name: journey_profile_id
          in: query
          required: false
          description: Filtra pelo perfil de jornada.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: started_from
          in: query
          required: false
          description: Data inicial minima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - name: started_to
          in: query
          required: false
          description: Data inicial maxima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-31"
        - name: ended_from
          in: query
          required: false
          description: Data de finalizacao minima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - name: ended_to
          in: query
          required: false
          description: Data de finalizacao maxima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-31"
      responses:
        "200":
          description: Jornadas retornadas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserJourneyListResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: Jornadas retornadas com sucesso.
                    data:
                      - id: 10
                        user_id: 2
                        user_name: Maria Silva
                        journey_profile:
                          id: 1
                          description: Privacidade e Seguranca
                          knowledge_domain:
                            id: 1
                            name: Privacidade
                        started_at: "2026-07-23 16:30:00"
                        finished_at: null
                        status: ongoing
                        is_completed: false
                        summary:
                          acquired_knowledges_count: 8
                          professional_certifications_count: 2
                        detail:
                          journey_id: 10
                          user_id: 2
                    meta:
                      pagination:
                        current_page: 1
                        per_page: 10
                        total: 1
                        last_page: 1
                        has_next_page: false
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "403":
          description: Usuario sem permissao para visualizar jornadas do usuario informado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                forbidden:
                  value:
                    success: false
                    message: Voce nao possui permissao para visualizar as jornadas deste usuario.
                    errors: []
                    code: USER_JOURNEYS_FORBIDDEN
        "404":
          description: Usuario informado nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                userNotFound:
                  value:
                    success: false
                    message: Usuario nao encontrado.
                    errors: []
                    code: USER_NOT_FOUND
        "422":
          description: Parametros de paginacao ou filtros invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidPagination:
                  value:
                    success: false
                    message: Parametros de paginacao invalidos.
                    errors:
                      page:
                        - A pagina atual deve ser maior ou igual a 1.
                    code: INVALID_PAGINATION_PARAMETERS
                invalidFilters:
                  value:
                    success: false
                    message: Parametros de filtro invalidos.
                    errors:
                      status:
                        - A situacao da jornada deve ser completed ou ongoing.
                      started_from:
                        - A data inicial minima deve estar no formato Y-m-d.
                    code: INVALID_JOURNEY_FILTERS
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Nao foi possivel buscar as jornadas no momento.
                    errors: []
                    code: JOURNEYS_SEARCH_FAILED
  /competencies:
    get:
      tags:
        - Competencies
      summary: Lista competencias
      operationId: listCompetencies
      responses:
        "200":
          description: Lista de competencias cadastradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyListResponse"
    post:
      tags:
        - Competencies
      summary: Cria uma competencia
      operationId: createCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetencyPayload"
            examples:
              privacy:
                value:
                  name: Privacidade de dados
                  description: Conceitos essenciais de protecao de dados pessoais.
      responses:
        "201":
          description: Competencia criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
  /competencies/{id}:
    parameters:
      - $ref: "#/components/parameters/CompetencyId"
    get:
      tags:
        - Competencies
      summary: Busca uma competencia por ID
      operationId: getCompetency
      responses:
        "200":
          description: Competencia encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "404":
          description: Competencia nao encontrada
    put:
      tags:
        - Competencies
      summary: Atualiza uma competencia
      operationId: updateCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetencyPayload"
      responses:
        "200":
          description: Competencia atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "404":
          description: Competencia nao encontrada
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
    delete:
      tags:
        - Competencies
      summary: Remove uma competencia
      operationId: deleteCompetency
      responses:
        "200":
          description: Competencia removida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "404":
          description: Competencia nao encontrada
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: jornada_session
      description: Cookie de sessao HttpOnly emitido pelo backend apos login. No Swagger UI, nao cole este cookie manualmente no botao Authorize; browsers nao permitem controlar corretamente o header Cookie nesse fluxo. Execute /auth/csrf-token e /auth/login no mesmo host da documentacao local para que o navegador armazene e envie o cookie automaticamente.
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Valor retornado em data.csrf_token por GET /auth/csrf-token. No Swagger local, execute primeiro /auth/csrf-token, copie data.csrf_token e cole aqui antes de chamar endpoints POST de sessao.
      schema:
        type: string
      example: test-csrf-token
    CompetencyId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    UserId:
      name: user
      in: path
      required: true
      description: Identificador do usuario cujas jornadas serao listadas.
      schema:
        type: integer
        minimum: 1
      example: 2
  schemas:
    HealthResponse:
