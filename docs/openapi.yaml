                          profile_experience:
                            id: null
                            description_pt: null
                            description_en: null
                          english_proficiency:
                            id: null
                            name_pt: null
                            name_en: null
                          higher_education_courses: []
                        latest_journey:
                          id: 4
                          user_id: 1
