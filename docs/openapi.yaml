  /journey-profiles:
    parameters:
      - name: page
        in: query
        description: Número da página
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Quantidade de itens por página
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
    get:
      tags:
        - JourneyProfiles
      summary: Lista tipos de jornada
      operationId: listJourneyProfiles
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Lista de tipos de jornada cadastrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProfileListResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidPagination:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      page:
                        - A pagina atual deve ser maior ou igual a 1.
                    code: VALIDATION_ERROR
  /journey-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/JourneyProfileId"
    get:
      tags:
        - JourneyProfiles
      summary: Busca um tipo de jornada por ID
      operationId: getJourneyProfile
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Tipo de jornada encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProfileResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Tipo de jornada nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: jornada_session
      description: Cookie de sessao HttpOnly emitido pelo backend apos login. Em integracoes browser cross-origin, o frontend deve chamar a API com credenciais habilitadas e a origem precisa estar permitida na configuracao CORS.
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Valor retornado em data.csrf_token por GET /auth/csrf-token. No Swagger local, execute primeiro /auth/csrf-token, copie data.csrf_token e cole aqui antes de chamar endpoints POST de sessao.
      schema:
        type: string
      example: test-csrf-token
    JourneyProfileId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    UserId:
      name: user
      in: path
      required: true
      description: Identificador do usuario cujas jornadas serao listadas.
      schema:
        type: integer
        minimum: 1
      example: 2
    JourneyId:
      name: journey
      in: path
      required: true
      description: Identificador da jornada que sera detalhada.
      schema:
        type: integer
        minimum: 1
      example: 10
  schemas:
    TemplateExampleSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Template endpoint retrieved successfully.
        data:
          $ref: "#/components/schemas/TemplateExample"
    TemplateExample:
      type: object
      required:
        - route_name
        - description
        - request_context
        - layers
        - repository_note
      properties:
        route_name:
          type: string
          example: template-example
        description:
          type: string
          example: Exemplo executavel de endpoint seguindo MVC + Services + Repositories.
        request_context:
          type: string
          example: swagger
        layers:
          type: array
          items:
            $ref: "#/components/schemas/TemplateExampleLayer"
        repository_note:
          type: string
          example: Esta repository retorna dados estaticos para demonstrar a arquitetura sem depender do banco.
    TemplateExampleLayer:
      type: object
      required:
        - layer
        - responsibility
        - put_here
      properties:
        layer:
          type: string
          example: service
        responsibility:
          type: string
          example: Orquestrar regra de negocio.
        put_here:
          type: string
          example: Fluxos, validacoes de dominio, decisoes e chamadas para repositories.
    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
        - last_page
        - has_next_page
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 3
        has_next_page:
          type: boolean
          example: true
    EmptySuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logout realizado com sucesso.
        data:
          type: "null"
          example: null
    CsrfTokenResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token CSRF gerado com sucesso.
        data:
          type: object
          required:
            - csrf_token
          properties:
            csrf_token:
              type: string
              example: 6g7XqYcH5q9mKpT3nB2wR8sV1zL0aE4d
    StandardValidationError:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation error.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            include_steps:
              - The include steps field must be true or false.
        code:
          type: string
          example: VALIDATION_ERROR
    StandardError:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred.
        errors:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
          example: {}
        code:
          type: string
          example: ERROR_CODE
    UserRegistrationResponse:
