openapi: 3.1.0
info:
  title: Jornada de Capacitacao API
  version: 0.1.0
  description: API REST inicial para a Jornada de Capacitacao para Privacidade e Seguranca.
servers:
  - url: http://localhost:8030/api
    description: Ambiente local via Docker
tags:
  - name: Health
    description: Endpoints de disponibilidade da API
  - name: Competencies
    description: Exemplo removivel de CRUD usando MVC, Services e Repositories
  - name: JourneyProfiles
    description: Consulta de tipos de jornada usando MVC, Services e Repositories
  - name: Template
    description: Endpoint de exemplo para demonstrar o contrato padrao da API no Swagger
paths:
  /health:
    get:
      tags:
        - Health
      summary: Verifica se a API esta disponivel
      operationId: getHealth
      responses:
        "200":
          description: API disponivel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    service: jornada-capacitacao-api
  /template-example:
    get:
      tags:
        - Template
      summary: Demonstra um endpoint usando MVC, Service, Repository, Resource e ApiResponse
      description: Rota de teste para visualizar no Swagger como um endpoint deve ser construido no projeto.
      operationId: getTemplateExample
      parameters:
        - name: context
          in: query
          required: false
          description: Texto opcional usado apenas para mostrar entrada validada pela FormRequest.
          schema:
            type: string
            maxLength: 80
          example: swagger
        - name: include_steps
          in: query
          required: false
          description: Quando true, retorna as camadas do exemplo.
          schema:
            type: boolean
            default: true
          example: true
      responses:
        "200":
          description: Exemplo retornado com contrato padrao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateExampleSuccessResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: Template endpoint retrieved successfully.
                    data:
                      route_name: template-example
                      description: Exemplo executavel de endpoint seguindo MVC + Services + Repositories.
                      request_context: swagger
                      layers:
                        - layer: request
                          responsibility: Validar entrada HTTP.
                          put_here: Regras de campos, tipos, obrigatoriedade e mensagens de validacao.
                        - layer: controller
                          responsibility: Receber a request e devolver a response padronizada.
                          put_here: Apenas chamadas para Services, Resources e ApiResponse.
                        - layer: service
                          responsibility: Orquestrar regra de negocio.
                          put_here: Fluxos, validacoes de dominio, decisoes e chamadas para repositories.
                        - layer: repository
                          responsibility: Encapsular acesso a dados.
                          put_here: Queries, Eloquent, filtros de persistencia e integracoes de leitura/escrita.
                        - layer: resource
                          responsibility: Formatar a entidade ou DTO para JSON.
                          put_here: Apenas campos de saida em snake_case, sem montar o contrato completo.
                      repository_note: Esta repository retorna dados estaticos para demonstrar a arquitetura sem depender do banco.
        "422":
          description: Erro de validacao no contrato padrao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidBoolean:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      include_steps:
                        - The include steps field must be true or false.
                    code: VALIDATION_ERROR
  /competencies:
    get:
      tags:
        - Competencies
      summary: Lista competencias
      operationId: listCompetencies
      responses:
        "200":
          description: Lista de competencias cadastradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyListResponse"
    post:
      tags:
        - Competencies
      summary: Cria uma competencia
      operationId: createCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetencyPayload"
            examples:
              privacy:
                value:
                  name: Privacidade de dados
                  description: Conceitos essenciais de protecao de dados pessoais.
      responses:
        "201":
          description: Competencia criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
  /competencies/{id}:
    parameters:
      - $ref: "#/components/parameters/CompetencyId"
    get:
      tags:
        - Competencies
      summary: Busca uma competencia por ID
      operationId: getCompetency
      responses:
        "200":
          description: Competencia encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "404":
          description: Competencia nao encontrada
    put:
      tags:
        - Competencies
      summary: Atualiza uma competencia
      operationId: updateCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetencyPayload"
      responses:
        "200":
          description: Competencia atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "404":
          description: Competencia nao encontrada
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
    delete:
      tags:
        - Competencies
      summary: Remove uma competencia
      operationId: deleteCompetency
      responses:
        "200":
          description: Competencia removida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "404":
          description: Competencia nao encontrada
  /journey-profiles:
    parameters:
      - name: page
        in: query
        description: Número da página
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Quantidade de itens por página
        required: false
        schema:
          type: integer
          default: 15
          minimum: 1
          maximum: 100
    get:
      tags:
        - JourneyProfiles
      summary: Lista tipos de jornada
      operationId: listJourneyProfiles
      responses:
        "200":
          description: Lista de tipos de jornada cadastrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProfileListResponse"
  /journey-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/JourneyProfileId"
    get:
      tags:
        - JourneyProfiles
      summary: Busca um tipo de jornada por ID
      operationId: getJourneyProfile
      responses:
        "200":
          description: Tipo de jornada encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProfileResponse"
        "404":
          description: Tipo de jornada nao encontrado
components:
  parameters:
    CompetencyId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    JourneyProfileId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: jornada-capacitacao-api
    TemplateExampleSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Template endpoint retrieved successfully.
        data:
          $ref: "#/components/schemas/TemplateExample"
    TemplateExample:
      type: object
      required:
        - route_name
        - description
        - request_context
        - layers
        - repository_note
      properties:
        route_name:
          type: string
          example: template-example
        description:
          type: string
          example: Exemplo executavel de endpoint seguindo MVC + Services + Repositories.
        request_context:
          type: string
          example: swagger
        layers:
          type: array
          items:
            $ref: "#/components/schemas/TemplateExampleLayer"
        repository_note:
          type: string
          example: Esta repository retorna dados estaticos para demonstrar a arquitetura sem depender do banco.
    TemplateExampleLayer:
      type: object
      required:
        - layer
        - responsibility
        - put_here
      properties:
        layer:
          type: string
          example: service
        responsibility:
          type: string
          example: Orquestrar regra de negocio.
        put_here:
          type: string
          example: Fluxos, validacoes de dominio, decisoes e chamadas para repositories.
    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
        - last_page
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 3
    CompetencyListResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Competencies retrieved successfully.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Competency"
    CompetencyResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Competency retrieved successfully.
        data:
          $ref: "#/components/schemas/Competency"
    EmptySuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Competency deleted successfully.
        data:
          type: "null"
          example: null
    StandardValidationError:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation error.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            include_steps:
              - The include steps field must be true or false.
        code:
          type: string
          example: VALIDATION_ERROR
    Competency:
      type: object
      required:
        - id
        - name
        - description
        - knowledge_area_id
        - difficulty_id
        - type
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Privacidade de dados
        description:
          type:
            - string
            - "null"
          example: Conceitos essenciais de protecao de dados pessoais.
        knowledge_area_id:
          type:
            - integer
            - "null"
          example: 1
        difficulty_id:
          type:
            - integer
            - "null"
          example: 1
        type:
          type:
            - integer
            - "null"
          example: 2
    CompetencyPayload:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Privacidade de dados
        description:
          type:
            - string
            - "null"
          maxLength: 500
          example: Conceitos essenciais de protecao de dados pessoais.
    JourneyProfileListResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Journey profiles retrieved successfully.
        data:
          type: array
          items:
            $ref: "#/components/schemas/JourneyProfile"
        meta:
          type: object
          properties:
            pagination:
              $ref: "#/components/schemas/PaginationMeta"

    JourneyProfileResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Journey profiles retrieved successfully."
        data:
          type: array
          items:
            $ref: '#/components/schemas/JourneyProfile'
    JourneyProfile:
      type: object
      required:
        - id
        - description_pt
        - description_en
        - type
      properties:
        id:
          type: integer
          example: 1
        description_pt:
          type: string
          example: "Agente Responsável pela Avaliação de Conformidade"
        description_en:
          type: string
          example: "Agent Responsible for Compliance Assessment"
        type:
          type: integer
          description: "1-Segurança, 2-Privacidade, 3-Misto"
          enum: [1, 2, 3]
          example: 1
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The name field is required.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
