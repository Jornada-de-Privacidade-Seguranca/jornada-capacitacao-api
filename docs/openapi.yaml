  /journeys/current/finalize:
    post:
      tags:
        - Journeys
      summary: Finaliza a jornada atual do usuario autenticado
      description: >-
        Valida o perfil da jornada (com dominio) e as respostas de todas as
        competencias do perfil, calcula a pontuacao, persiste o resultado em
        TB_JORNADA.NU_PONTUACAO_TOTAL e registra a finalizacao em DH_FIM. As
        respostas do pre-questionario (experiencia profissional, tempo de
        atuacao no perfil, ingles, formacao academica e certificacoes) sairam do
        fluxo e nao sao mais exigidas nem entram na pontuacao. A pontuacao vai de
        0 a 100 e considera so as competencias: cada competencia vale
        (peso da area x nivel / 5), com o peso da area em
        TB_PESO_CRIT_COMPETENCIA para o perfil, e a pontuacao e a soma das
        competencias do perfil declaradas como possuidas dividida pela soma de
        todas as competencias do perfil, vezes 100. Sem pesos configurados para o
        perfil, a pontuacao e zero. O detalhamento por categoria
        (score_breakdown) continua sendo persistido, mas esta deprecado. Jornadas
        finalizadas antes desta regra mantem a pontuacao calculada com a formula
        anterior, sem recalculo. A pontuacao e interna e nao e retornada por este
        endpoint. Uma nova chamada quando a jornada mais recente ja esta
        finalizada retorna conflito.
      operationId: finalizeCurrentJourney
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Jornada finalizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyFinalizationResponse"
              examples:
                finalized:
                  value:
                    success: true
                    message: Jornada finalizada com sucesso.
                    data:
                      journey_id: 10
                      status: completed
                      finished_at: "2026-09-28 14:30:00"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Usuario nao possui jornada atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                journeyNotFound:
                  value:
                    success: false
                    message: Jornada atual nao encontrada.
                    errors: []
                    code: JOURNEY_NOT_FOUND
        "409":
          description: Jornada mais recente ja foi finalizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                alreadyFinished:
                  value:
                    success: false
                    message: Esta jornada ja foi finalizada.
                    errors: []
                    code: JOURNEY_ALREADY_FINISHED
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          description: Jornada possui etapas obrigatorias pendentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                incompleteJourney:
                  value:
                    success: false
                    message: Existem etapas obrigatorias pendentes.
                    errors:
                      fields:
                        - answers.competencies
                    code: INCOMPLETE_JOURNEY
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Nao foi possivel finalizar a jornada no momento.
                    errors: []
                    code: JOURNEY_FINALIZATION_FAILED

