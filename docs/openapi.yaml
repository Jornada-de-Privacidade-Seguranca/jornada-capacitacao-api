  /auth/logout:
    post:
      tags:
        - Auth
      summary: Encerra a sessao autenticada
      description: Invalida a sessao atual no backend e regenera o token de sessao. Depois do logout, o cookie anterior nao autentica novas chamadas para /me.
      operationId: logoutUser
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Logout realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              examples:
                loggedOut:
                  value:
                    success: true
                    message: Logout realizado com sucesso.
                    data: null
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "403":
          description: Conta da sessao atual nao esta ativa
          content:
            application/json:
              schema:
