              examples:
                csrfTokenMismatch:
                  value:
                    success: false
                    message: Token CSRF invalido.
                    errors: []
                    code: CSRF_TOKEN_MISMATCH
  /users/{user}/journeys:
    get:
      tags:
        - Journeys
      summary: Lista jornadas paginadas de um usuario
      description: Retorna as jornadas do usuario informado, da mais recente para a mais antiga. Usuarios comuns so podem consultar as proprias jornadas; administradores podem consultar jornadas de qualquer usuario. Para testar no Swagger local, faca login antes em /auth/login usando o token retornado por /auth/csrf-token; nao cole manualmente o cookie no botao Authorize.
      operationId: listUserJourneys
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: page
          in: query
          required: false
          description: Pagina atual.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Quantidade de registros por pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
        - name: status
          in: query
          required: false
          description: Filtra pela situacao da jornada.
          schema:
            type: string
            enum:
              - completed
              - ongoing
          example: ongoing
        - name: journey_profile_id
          in: query
          required: false
          description: Filtra pelo perfil de jornada.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: started_from
          in: query
          required: false
          description: Data inicial minima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - name: started_to
          in: query
          required: false
          description: Data inicial maxima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-31"
        - name: ended_from
          in: query
          required: false
          description: Data de finalizacao minima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - name: ended_to
          in: query
          required: false
          description: Data de finalizacao maxima da jornada.
          schema:
            type: string
            format: date
          example: "2026-07-31"
      responses:
        "200":
          description: Jornadas retornadas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserJourneyListResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: Jornadas retornadas com sucesso.
                    data:
                      - id: 10
                        user_id: 2
                        user_name: Maria Silva
                        journey_profile:
                          id: 1
                          name: Encarregado pelo Tratamento de Dados Pessoais
                          description: Privacidade e Seguranca
                          knowledge_domain:
                            id: 1
                            name: Privacidade
                        started_at: "2026-07-23 16:30:00"
                        finished_at: null
                        status: ongoing
                        is_completed: false
                        summary:
                          acquired_knowledges_count: 8
                          professional_certifications_count: 2
                        detail:
                          journey_id: 10
                          user_id: 2
                    meta:
                      pagination:
                        current_page: 1
                        per_page: 10
                        total: 1
                        last_page: 1
                        has_next_page: false
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "403":
          description: Usuario sem permissao para visualizar jornadas do usuario informado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                forbidden:
                  value:
                    success: false
                    message: Voce nao possui permissao para visualizar as jornadas deste usuario.
                    errors: []
                    code: USER_JOURNEYS_FORBIDDEN
        "404":
          description: Usuario informado nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                userNotFound:
                  value:
                    success: false
                    message: Usuario nao encontrado.
                    errors: []
                    code: USER_NOT_FOUND
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidPagination:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      page:
                        - A pagina atual deve ser maior ou igual a 1.
                    code: VALIDATION_ERROR
                invalidFilters:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      status:
                        - A situacao da jornada deve ser completed ou ongoing.
                      started_from:
                        - A data inicial minima deve estar no formato Y-m-d.
                    code: VALIDATION_ERROR
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Nao foi possivel buscar as jornadas no momento.
                    errors: []
                    code: JOURNEYS_SEARCH_FAILED
    post:
      tags:
        - Journeys
      summary: Inicia uma nova jornada para um usuario
      description: Registra o inicio de uma nova jornada para o usuario informado. Usuarios comuns so podem iniciar jornadas para si mesmos; administradores podem iniciar jornadas para qualquer usuario. O usuario nao pode possuir outra jornada em andamento (com DH_FIM nulo). Para testar no Swagger local, faca login antes em /auth/login usando o token retornado por /auth/csrf-token; nao cole manualmente o cookie no botao Authorize.
      operationId: createUserJourney
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserJourneyCreatePayload"
            examples:
              minimal:
                value:
                  journey_profile_id: 1
              complete:
                value:
                  journey_profile_id: 1
                  professional_experience_id: 1
                  profile_experience_id: 2
                  english_proficiency_id: 1
                  higher_education_course_id: 1
                  postgraduate_course_id: 1
      responses:
        "201":
          description: Jornada iniciada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserJourneyCreateResponse"
              examples:
                created:
                  value:
                    success: true
                    message: Jornada iniciada com sucesso.
                    data:
                      id: 10
                      user_id: 2
                      user_name: Maria Silva
                      journey_profile:
                        id: 1
                        name: Encarregado pelo Tratamento de Dados Pessoais
                        description: Privacidade e Seguranca
                        knowledge_domain:
                          id: 1
                          name: Privacidade
                      started_at: "2026-07-23 16:30:00"
                      finished_at: null
                      status: ongoing
                      is_completed: false
                      summary:
                        acquired_knowledges_count: 0
                        professional_certifications_count: 0
                      detail:
                        journey_id: 10
                        user_id: 2
        "404":
          description: Jornada informada nao encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                userNotFound:
                  value:
                    success: false
                    message: Usuario nao encontrado.
                    errors: []
                    code: USER_NOT_FOUND
                journeyProfileNotFound:
                  value:
                    success: false
                    message: Perfil de jornada nao encontrado.
                    errors: []
                    code: JOURNEY_PROFILE_NOT_FOUND
        "409":
          description: Usuario ja possui uma jornada em andamento
          journeyInProgress:
            value:
              success: false
              message: Voce ja possui uma jornada em andamento. Finalize ou continue a jornada atual antes de iniciar uma nova.
              errors: []
              code: JOURNEY_IN_PROGRESS
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                missingRequiredFields:
                  value:
                    success: false
                    message: Dados obrigatorios nao informados.
                    errors:
                      journey_profile_id:
                        - O perfil de jornada e obrigatorio.
                    code: REQUIRED_FIELDS_MISSING
                invalidData:
                  value:
                    success: false
                    message: Dados invalidos.
                    errors:
                      professional_experience_id:
                        - A experiencia profissional informada nao existe.
                    code: VALIDATION_ERROR
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Nao foi possivel iniciar a jornada no momento.
                    errors: []
                    code: JOURNEY_SEARCH_FAILED

