openapi: 3.1.0
info:
  title: Jornada de Capacitacao API
  version: 0.1.0
  description: API REST inicial para a Jornada de Capacitacao para Privacidade e Seguranca. A autenticacao usa sessao por cookie HttpOnly emitido pelo backend; clientes browser em origem diferente devem enviar credenciais nas requisicoes e usar uma origem CORS explicitamente permitida.
servers:
  - url: http://localhost:8030/api
    description: Ambiente local via Docker
tags:
  - name: Auth
    description: Endpoints publicos de cadastro e autenticacao
  - name: Dashboard
    description: Endpoints de dados do painel inicial do usuario
  - name: JourneyProfiles
    description: Consulta de tipos de jornada usando MVC, Services e Repositories
  - name: Template
    description: Endpoint de exemplo para demonstrar o contrato padrao da API no Swagger
  - name: System
    description: Endpoints de status e resumo do sistema
  # - name: Users
  #   description: Endpoints de cadastro e gestao de usuarios
  - name: Journeys
    description: Endpoints de consulta das jornadas dos usuarios
paths:
  /template-example:
    get:
      tags:
        - Template
      summary: Demonstra um endpoint usando MVC, Service, Repository, Resource e ApiResponse
      description: Rota de teste para visualizar no Swagger como um endpoint deve ser construido no projeto.
      operationId: getTemplateExample
      parameters:
        - name: context
          in: query
          required: false
          description: Texto opcional usado apenas para mostrar entrada validada pela FormRequest.
          schema:
            type: string
            maxLength: 80
          example: swagger
        - name: include_steps
          in: query
          required: false
          description: Quando true, retorna as camadas do exemplo.
          schema:
            type: boolean
            default: true
          example: true
      responses:
        "200":
          description: Exemplo retornado com contrato padrao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateExampleSuccessResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: Template endpoint retrieved successfully.
                    data:
                      route_name: template-example
                      description: Exemplo executavel de endpoint seguindo MVC + Services + Repositories.
                      request_context: swagger
                      layers:
                        - layer: request
                          responsibility: Validar entrada HTTP.
                          put_here: Regras de campos, tipos, obrigatoriedade e mensagens de validacao.
                        - layer: controller
                          responsibility: Receber a request e devolver a response padronizada.
                          put_here: Apenas chamadas para Services, Resources e ApiResponse.
                        - layer: service
                          responsibility: Orquestrar regra de negocio.
                          put_here: Fluxos, validacoes de dominio, decisoes e chamadas para repositories.
                        - layer: repository
                          responsibility: Encapsular acesso a dados.
                          put_here: Queries, Eloquent, filtros de persistencia e integracoes de leitura/escrita.
                        - layer: resource
                          responsibility: Formatar a entidade ou DTO para JSON.
                          put_here: Apenas campos de saida em snake_case, sem montar o contrato completo.
                      repository_note: Esta repository retorna dados estaticos para demonstrar a arquitetura sem depender do banco.
        "422":
          description: Erro de validacao no contrato padrao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidBoolean:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      include_steps:
                        - The include steps field must be true or false.
                    code: VALIDATION_ERROR
  /system-summary:
    get:
      tags:
        - System
      summary: Retorna estatisticas e resumo do sistema
      description: Endpoint administrativo autenticado para consulta de resumo operacional do sistema e banco de dados. Somente administradores ativos podem consultar.
      operationId: getSystemSummary
      security:
        - sessionAuth: []
      parameters:
        - name: include_database_status
          in: query
          required: false
          description: Quando true, retorna status de conexao e driver do banco de dados.
          schema:
            type: boolean
            default: true
          example: true
        - name: tag
          in: query
          required: false
          description: Tag ou identificador opcional para rastreamento ou filtragem.
          schema:
            type: string
            maxLength: 50
          example: monitoring
      responses:
        "200":
          description: Resumo do sistema retornado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSummarySuccessResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: System summary retrieved successfully.
                    data:
                      app_name: Jornada de Capacitacao API
                      environment: local
                      tag: monitoring
                      database:
                        competencies_count: 5
                        connected: true
                        driver: pgsql
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Usuario autenticado sem permissao de administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                forbidden:
                  value:
                    success: false
                    message: Voce nao possui permissao para visualizar o resumo do sistema.
                    errors: []
                    code: SYSTEM_SUMMARY_FORBIDDEN
        "422":
          description: Erro de validacao no contrato padrao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidBoolean:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      include_database_status:
                        - The include database status field must be true or false.
                    code: VALIDATION_ERROR
        "500":
          description: Erro interno ao buscar resumo do sistema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalError:
                  value:
                    success: false
                    message: Nao foi possivel buscar o resumo do sistema no momento.
                    errors: []
                    code: SYSTEM_SUMMARY_FAILED
  /auth/register:
    post:
      tags:
        - Auth
      summary: Cadastra um usuario pendente de ativacao
      description: Cria uma conta de usuario com status pendente de ativacao por administrador. A conta recebe sempre o perfil de acesso "Usuario" (id 3); um `profile_type_id` enviado na requisicao e ignorado.
      x-rate-limit: 3 requisicoes por minuto por IP.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationPayload"
            examples:
              valid:
                value:
                  name: Maria Silva
                  email: maria.silva@example.com
                  password: SenhaSegura123
                  password_confirmation: SenhaSegura123
                  organization: Secretaria de Governo
                  department: Privacidade
                  registration_number: MAT-123
                  journey_profile_id: 1
      responses:
        "201":
          description: Usuario cadastrado com ativacao pendente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRegistrationResponse"
              examples:
                created:
                  value:
                    success: true
                    message: Cadastro realizado com sucesso. Sua conta foi criada, mas ainda precisa ser ativada por um administrador do sistema para permitir o acesso.
                    data:
                      id: 1
                      name: Maria Silva
                      email: maria.silva@example.com
                      organization_company: Secretaria de Governo
                      department: Privacidade
                      registration_number: MAT-123
                      profile_type_id: 3
                      journey_profile_id: 1
                      active_status: 2
                      account_status: pending_activation
                      created_at: "2026-07-23 16:30:00"
        "409":
          description: Conta ja cadastrada, inclusive quando o e-mail difere apenas por maiusculas/minusculas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                duplicate:
                  value:
                    success: false
                    message: Ja existe uma conta cadastrada com este e-mail.
                    errors:
                      email:
                        - Informe outro e-mail ou solicite a ativacao da conta existente.
                    code: ACCOUNT_ALREADY_EXISTS
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidJourneyProfile:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      journey_profile_id:
                        - Informe um perfil de jornada valido.
                    code: VALIDATION_ERROR
        "429":
          description: Muitas tentativas de cadastro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                tooManyAttempts:
                  value:
                    success: false
                    message: Muitas tentativas. Tente novamente mais tarde.
                    errors: []
                    code: TOO_MANY_ATTEMPTS
  /admin/users/pending-activation:
    get:
      tags:
        - Auth
      summary: Lista contas pendentes de ativacao
      description: Lista contas pendentes com ST_ATIVO igual a 2. Exige a permissao users.view. A listagem e paginada; ST_ATIVO igual a 0 indica conta inativa e 1 indica conta ativa.
      operationId: listPendingUserActivations
      security:
        - sessionAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Contas pendentes retornadas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingUserActivationListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Usuario autenticado sem a permissao users.view (code PERMISSION_DENIED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "422":
          description: Parametros de paginacao invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
  /admin/users/{user}/activate:
    post:
      tags:
        - Auth
      summary: Ativa uma conta pendente como usuario comum
      description: Exige a permissao users.deactivate e CSRF. A conta deve ter ST_ATIVO igual a 2; a ativacao define ST_ATIVO igual a 1 e o perfil de acesso como Usuario.
      operationId: activatePendingUser
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Conta ativada como usuario comum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministeredUserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Identificador do usuario invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
        "403":
          description: Usuario autenticado sem a permissao users.deactivate (code PERMISSION_DENIED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "409":
          description: Conta nao esta pendente de ativacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
  /admin/users/{user}/deactivate:
    post:
      tags:
        - Auth
      summary: Desativa um usuario comum ativo
      description: Exige users.deactivate e CSRF. A conta deve estar ativa e ter perfil de acesso Usuario; a desativacao define ST_ATIVO igual a 0.
      operationId: deactivateCommonUser
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Usuario comum desativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministeredUserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Identificador do usuario invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
        "403":
          description: Usuario autenticado sem a permissao users.deactivate (code PERMISSION_DENIED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Usuario nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "409":
          description: Conta nao e de usuario comum ativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
  /auth/csrf-token:
    get:
      tags:
        - Auth
      summary: Gera token CSRF para requisicoes de sessao
      description: Inicia ou reutiliza a sessao atual e retorna o token CSRF que deve ser enviado no header X-CSRF-TOKEN em endpoints mutaveis de sessao, como login e logout.
      operationId: getCsrfToken
      responses:
        "200":
          description: Token CSRF gerado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: Token CSRF gerado com sucesso.
                    data:
                      csrf_token: 6g7XqYcH5q9mKpT3nB2wR8sV1zL0aE4d
  /auth/login:
    post:
      tags:
        - Auth
      summary: Autentica um usuario
      description: Valida e-mail e senha, bloqueia contas inativas, cria sessao de autenticacao controlada pelo backend e retorna o perfil do usuario autenticado para redirecionamento no front-end. A resposta inclui o tempo maximo de inatividade da sessao, em minutos. No Swagger local, execute antes GET /auth/csrf-token, copie data.csrf_token para o header X-CSRF-TOKEN desta chamada e nao use o botao Authorize para colar cookies manualmente; o navegador enviara o cookie HttpOnly automaticamente depois do login.
      operationId: loginUser
      x-rate-limit: 5 requisicoes por minuto por combinacao de IP e e-mail normalizado.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPayload"
            examples:
              valid:
                value:
                  email: maria.silva@example.com
                  password: secret123
      responses:
        "200":
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                commonUser:
                  value:
                    success: true
                    message: Login realizado com sucesso.
                    data:
                      id: 1
                      name: Maria Silva
                      email: maria.silva@example.com
                      organization: Secretaria de Governo
                      department: Privacidade
                      registration_number: MAT-123
                      created_at: "2026-07-23 16:30:00"
                      role: common_user
                      profile:
                        role: common_user
                        label: Usuario comum
                        id: 3
                        name: Usuário
                        permissions:
                          - journeys.take
                          - results.view_own
                        profile_type_id: 3
                        profile_type_name: Usuário
                      active_status: 1
                    meta:
                      session:
                        lifetime_minutes: 120
                administrator:
                  value:
                    success: true
                    message: Login realizado com sucesso.
                    data:
                      id: 2
                      name: Admin Sistema
                      email: admin@example.com
                      organization: Secretaria de Governo
                      department: Privacidade
                      registration_number: MAT-123
                      created_at: "2026-07-23 16:30:00"
                      role: administrator
                      profile:
                        role: administrator
                        label: Administrador
                        id: 1
                        name: Administrador
                        permissions:
                          - journeys.take
                          - journeys.assign
                          - results.view_own
                          - results.view_all
                          - users.view
                          - users.register
                          - users.deactivate
                          - users.manage
                          - users.change_profile
                          - catalog.manage
                        profile_type_id: 1
                        profile_type_name: Administrador
                      active_status: 1
                    meta:
                      session:
                        lifetime_minutes: 120
        "401":
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                invalidCredentials:
                  value:
                    success: false
                    message: Usuario e/ou senha invalidos.
                    errors: []
                    code: INVALID_CREDENTIALS
        "403":
          description: Conta pendente de ativacao pelo administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                accountNotActivated:
                  value:
                    success: false
                    message: Sua conta ainda nao foi ativada por um administrador do sistema.
                    errors: []
                    code: ACCOUNT_NOT_ACTIVATED
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
        "429":
          description: Muitas tentativas de login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                tooManyAttempts:
                  value:
                    success: false
                    message: Muitas tentativas. Tente novamente mais tarde.
                    errors: []
                    code: TOO_MANY_ATTEMPTS
        "419":
          description: Token CSRF ausente ou invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                csrfTokenMismatch:
                  value:
                    success: false
                    message: Token CSRF invalido.
                    errors: []
                    code: CSRF_TOKEN_MISMATCH
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Erro interno do servidor.
                    errors: []
                    code: INTERNAL_SERVER_ERROR
  /me:
    get:
      tags:
        - Auth
      summary: Recupera o usuario autenticado
      description: >-
        Retorna os dados do usuario identificado pela sessao atual, sem receber identificador pelo cliente, e renova a atividade da sessao. A resposta inclui o perfil de acesso (id, nome e permissoes) e o tempo maximo de inatividade em minutos. O campo role e derivado do perfil de acesso e nunca de FK_TIPO_USUARIO.
      operationId: getAuthenticatedUser
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Usuario autenticado recuperado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
              examples:
                commonUser:
                  value:
                    success: true
                    message: Usuario autenticado recuperado com sucesso.
                    data:
                      id: 1
                      name: Maria Silva
                      email: maria.silva@example.com
                      organization: Secretaria de Governo
                      department: Privacidade
                      registration_number: MAT-123
                      created_at: "2026-07-23 16:30:00"
                      role: common_user
                      profile:
                        role: common_user
                        label: Usuario comum
                        id: 3
                        name: Usuário
                        permissions:
                          - journeys.take
                          - results.view_own
                        profile_type_id: 3
                        profile_type_name: Usuário
                        journey_profile_id: 1
                        journey_profile_name: Encarregado pelo Tratamento de Dados Pessoais
                        journey_profile_name_en: Data Protection Officer
                      active_status: 1
                    meta:
                      session:
                        lifetime_minutes: 120
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "403":
          description: Conta da sessao atual nao esta ativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                accountNotActivated:
                  value:
                    success: false
                    message: Sua conta ainda nao foi ativada por um administrador do sistema.
                    errors: []
                    code: ACCOUNT_NOT_ACTIVATED
    patch:
      tags:
        - Auth
      summary: Atualiza os dados do usuario autenticado
      description: Altera nome, e-mail, orgao/empresa e setor do usuario da sessao, com as mesmas validacoes do cadastro. Apenas os campos enviados sao alterados; pelo menos um e obrigatorio. O e-mail continua unico, sem diferenciar maiusculas e minusculas. O codigo de funcionario (`registration_number`) nao e editavel e, se enviado, e ignorado. Requer sessao autenticada e token CSRF.
      operationId: updateAuthenticatedUser
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfilePayload"
            examples:
              allFields:
                summary: Todos os campos editaveis
                value:
                  name: Maria Souza
                  email: maria.souza@example.com
                  organization: Secretaria de Governo
                  department: Seguranca da Informacao
              singleField:
                summary: Apenas o setor
                value:
                  department: Seguranca da Informacao
      responses:
        "200":
          description: Dados do usuario atualizados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
              examples:
                updated:
                  value:
                    success: true
                    message: Dados do usuario atualizados com sucesso.
                    data:
                      id: 1
                      name: Maria Souza
                      email: maria.souza@example.com
                      organization: Secretaria de Governo
                      department: Seguranca da Informacao
                      registration_number: MAT-123
                      created_at: "2026-07-23 16:30:00"
                      role: common_user
                      profile:
                        role: common_user
                        label: Usuario comum
                        id: 3
                        name: Usuário
                        permissions:
                          - journeys.take
                          - results.view_own
                        profile_type_id: 3
                        profile_type_name: Usuário
                        journey_profile_id: 1
                        journey_profile_name: Encarregado pelo Tratamento de Dados Pessoais
                        journey_profile_name_en: Data Protection Officer
                      active_status: 1
                    meta:
                      session:
                        lifetime_minutes: 120
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "409":
          description: E-mail ja usado por outra conta, inclusive quando difere apenas por maiusculas/minusculas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                emailInUse:
                  value:
                    success: false
                    message: Ja existe uma conta cadastrada com este e-mail.
                    errors:
                      email:
                        - Informe outro e-mail.
                    code: EMAIL_ALREADY_IN_USE
        "419":
          description: Token CSRF ausente ou invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                csrfMismatch:
                  value:
                    success: false
                    message: Token CSRF invalido.
                    errors: []
                    code: CSRF_TOKEN_MISMATCH
        "422":
          description: Dados invalidos ou nenhum campo editavel enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                noFields:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      name:
                        - "Informe ao menos um dos dados: nome, e-mail, orgao/empresa ou setor."
                      email:
                        - "Informe ao menos um dos dados: nome, e-mail, orgao/empresa ou setor."
                      organization:
                        - "Informe ao menos um dos dados: nome, e-mail, orgao/empresa ou setor."
                      department:
                        - "Informe ao menos um dos dados: nome, e-mail, orgao/empresa ou setor."
                    code: VALIDATION_ERROR
