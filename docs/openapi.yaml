      description: >-
        Deprecado: o pre-questionario saiu do fluxo da jornada. Esta rota nao e mais exigida pela finalizacao nem entra na nota, e sera removida futuramente.
        Atualiza nivel de ingles, experiencia profissional e/ou tempo de atuacao no perfil na jornada em andamento do usuario autenticado. O salvamento e parcial; somente os campos enviados sao atualizados e os demais sao mantidos. Pelo menos um dos tres campos deve ser enviado, e valores null nao limpam campos ja salvos (retornam 422). A resposta sempre devolve os tres campos e is_complete. Este endpoint nao calcula nem retorna pontuacao. Para testar no Swagger local, faca login antes em /auth/login usando o token retornado por /auth/csrf-token e envie o header X-CSRF-TOKEN.
      deprecated: true
      operationId: updateCurrentJourneyGeneralData
