                  value:
                    success: true
                    message: Dados gerais da jornada salvos com sucesso.
                    data:
                      journey_id: 15
                      status: ongoing
                      is_complete: false
                      english_level: null
                      professional_experience:
                        id: 2
                        description_pt: Entre 1 e 3 anos
                        description_en: Between 1 and 3 years
                      profile_experience: null
                ok:
                  summary: Com os tres campos preenchidos
                  value:
                    success: true
                    message: Dados gerais da jornada salvos com sucesso.
                    data:
                      journey_id: 15
                      status: ongoing
                      is_complete: true
                      english_level:
                        id: 10
                        name_pt: Nenhum
                        name_en: None
                      professional_experience:
                        id: 2
                        description_pt: Entre 1 e 3 anos
                        description_en: Between 1 and 3 years
                      profile_experience:
                        id: 3
                        description_pt: Entre 4 e 6 anos
                        description_en: Between 4 and 6 years
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
