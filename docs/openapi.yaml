openapi: 3.1.0
info:
  title: Jornada de Capacitacao API
  version: 0.1.0
  description: API REST inicial para a Jornada de Capacitacao para Privacidade e Seguranca. A autenticacao usa sessao por cookie HttpOnly emitido pelo backend; clientes browser em origem diferente devem enviar credenciais nas requisicoes e usar uma origem CORS explicitamente permitida.
servers:
  - url: http://localhost:8030/api
    description: Ambiente local via Docker
tags:
  - name: Health
    description: Endpoints de disponibilidade da API
  - name: Auth
    description: Endpoints de autenticacao
  - name: Dashboard
    description: Endpoints de dados do painel inicial do usuario
  - name: Competencies
    description: Exemplo removivel de CRUD usando MVC, Services e Repositories
  - name: Template
    description: Endpoint de exemplo para demonstrar o contrato padrao da API no Swagger
  - name: Users
    description: Endpoints de cadastro e gestao de usuarios
paths:
  /health:
    get:
      tags:
        - Health
      summary: Verifica se a API esta disponivel
      operationId: getHealth
      responses:
        "200":
          description: API disponivel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    service: jornada-capacitacao-api
  /template-example:
    get:
      tags:
        - Template
      summary: Demonstra um endpoint usando MVC, Service, Repository, Resource e ApiResponse
      description: Rota de teste para visualizar no Swagger como um endpoint deve ser construido no projeto.
      operationId: getTemplateExample
      parameters:
        - name: context
          in: query
          required: false
          description: Texto opcional usado apenas para mostrar entrada validada pela FormRequest.
          schema:
            type: string
            maxLength: 80
          example: swagger
        - name: include_steps
          in: query
          required: false
          description: Quando true, retorna as camadas do exemplo.
          schema:
            type: boolean
            default: true
          example: true
      responses:
        "200":
          description: Exemplo retornado com contrato padrao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateExampleSuccessResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: Template endpoint retrieved successfully.
                    data:
                      route_name: template-example
                      description: Exemplo executavel de endpoint seguindo MVC + Services + Repositories.
                      request_context: swagger
                      layers:
                        - layer: request
                          responsibility: Validar entrada HTTP.
                          put_here: Regras de campos, tipos, obrigatoriedade e mensagens de validacao.
                        - layer: controller
                          responsibility: Receber a request e devolver a response padronizada.
                          put_here: Apenas chamadas para Services, Resources e ApiResponse.
                        - layer: service
                          responsibility: Orquestrar regra de negocio.
                          put_here: Fluxos, validacoes de dominio, decisoes e chamadas para repositories.
                        - layer: repository
                          responsibility: Encapsular acesso a dados.
                          put_here: Queries, Eloquent, filtros de persistencia e integracoes de leitura/escrita.
                        - layer: resource
                          responsibility: Formatar a entidade ou DTO para JSON.
                          put_here: Apenas campos de saida em snake_case, sem montar o contrato completo.
                      repository_note: Esta repository retorna dados estaticos para demonstrar a arquitetura sem depender do banco.
        "422":
          description: Erro de validacao no contrato padrao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidBoolean:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      include_steps:
                        - The include steps field must be true or false.
                    code: VALIDATION_ERROR
  /users/register:
    post:
      tags:
        - Users
      summary: Cadastra um usuario pendente de ativacao
      description: Cria uma conta de usuario com status pendente de ativacao por administrador.
      x-rate-limit: 3 requisicoes por minuto por IP.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationPayload"
            examples:
              valid:
                value:
                  name: Maria Silva
                  email: maria.silva@example.com
                  password: secret123
                  password_confirmation: secret123
                  organization_company: Ministerio da Justica
                  department: Privacidade
                  registration_number: MJ-123
                  profile_type_id: 1
      responses:
        "201":
          description: Usuario cadastrado pendente de ativacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRegistrationResponse"
              examples:
                created:
                  value:
                    success: true
                    message: Cadastro realizado com sucesso. Sua conta foi criada, mas ainda precisa ser ativada por um administrador do sistema para permitir o acesso.
                    data:
                      id: 1
                      name: Maria Silva
                      email: maria.silva@example.com
                      organization_company: Ministerio da Justica
                      department: Privacidade
                      registration_number: MJ-123
                      profile_type_id: 1
                      active_status: 2
                      account_status: pending_activation
                      created_at: "2026-07-23 16:30:00"
        "409":
          description: Conta ja cadastrada, inclusive quando o e-mail difere apenas por maiusculas/minusculas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                duplicate:
                  value:
                    success: false
                    message: Ja existe uma conta cadastrada com este e-mail.
                    errors:
                      email:
                        - Ja existe uma conta cadastrada com este e-mail.
                    code: USER_ALREADY_EXISTS
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
        "429":
          description: Muitas tentativas de cadastro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                tooManyAttempts:
                  value:
                    success: false
                    message: Muitas tentativas. Tente novamente mais tarde.
                    errors: []
                    code: TOO_MANY_ATTEMPTS
  /auth/login:
    post:
      tags:
        - Auth
      summary: Autentica um usuario
      description: Valida e-mail e senha, bloqueia contas inativas, cria sessao de autenticacao controlada pelo backend e retorna o perfil do usuario autenticado para redirecionamento no front-end. Em browsers, a resposta emite o cookie de sessao HttpOnly e as chamadas seguintes devem enviar credenciais.
      operationId: loginUser
      x-rate-limit: 5 requisicoes por minuto por combinacao de IP e e-mail normalizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPayload"
            examples:
              valid:
                value:
                  email: maria.silva@example.com
                  password: secret123
      responses:
        "200":
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                commonUser:
                  value:
                    success: true
                    message: Login realizado com sucesso.
                    data:
                      id: 1
                      name: Maria Silva
                      email: maria.silva@example.com
                      role: common_user
                      profile:
                        role: common_user
                        label: Usuario comum
                        user_type_id: 2
                        profile_type_id: 1
                        profile_type_name: Aluno
                      active_status: 1
                administrator:
                  value:
                    success: true
                    message: Login realizado com sucesso.
                    data:
                      id: 2
                      name: Admin Sistema
                      email: admin@example.com
                      role: administrator
                      profile:
                        role: administrator
                        label: Administrador
                        user_type_id: 1
                        profile_type_id: null
                        profile_type_name: null
                      active_status: 1
        "401":
          description: Credenciais invalidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                invalidCredentials:
                  value:
                    success: false
                    message: Usuario e/ou senha invalidos.
                    errors: []
                    code: INVALID_CREDENTIALS
        "403":
          description: Conta pendente de ativacao pelo administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                accountNotActivated:
                  value:
                    success: false
                    message: Sua conta ainda nao foi ativada por um administrador do sistema.
                    errors: []
                    code: ACCOUNT_NOT_ACTIVATED
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
        "429":
          description: Muitas tentativas de login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                tooManyAttempts:
                  value:
                    success: false
                    message: Muitas tentativas. Tente novamente mais tarde.
                    errors: []
                    code: TOO_MANY_ATTEMPTS
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Erro interno do servidor.
                    errors: []
                    code: INTERNAL_SERVER_ERROR
  /me:
    get:
      tags:
        - Auth
      summary: Recupera o usuario autenticado
      description: Retorna os dados do usuario identificado pela sessao atual, sem receber identificador pelo cliente. Se o usuario da sessao for desativado apos o login, a sessao e invalidada e a resposta e 403.
      operationId: getAuthenticatedUser
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Usuario autenticado recuperado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
              examples:
                commonUser:
                  value:
                    success: true
                    message: Usuario autenticado recuperado com sucesso.
                    data:
                      id: 1
                      name: Maria Silva
                      email: maria.silva@example.com
                      role: common_user
                      profile:
                        role: common_user
                        label: Usuario comum
                        user_type_id: 2
                        profile_type_id: 1
                        profile_type_name: Aluno
                      active_status: 1
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "403":
          description: Conta da sessao atual nao esta ativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                accountNotActivated:
                  value:
                    success: false
                    message: Sua conta ainda nao foi ativada por um administrador do sistema.
                    errors: []
                    code: ACCOUNT_NOT_ACTIVATED
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Recupera os dados do painel do usuario autenticado
      description: Retorna dados basicos do usuario autenticado, jornada em andamento quando houver, ultima jornada concluida e ate tres outras jornadas concluidas recentes do mesmo usuario.
      operationId: getDashboard
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Dados do painel recuperados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
              examples:
                withJourneys:
                  value:
                    success: true
                    message: Dados do painel recuperados com sucesso.
                    data:
                      user:
                        id: 1
                        name: Maria Silva
                        email: maria.silva@example.com
                        role: common_user
                        organization: Ministerio da Justica
                        department: Privacidade
                        registration_number: MJ-123
                        profile:
                          role: common_user
                          label: Usuario comum
                          user_type_id: 2
                          profile_type_id: 1
                          profile_type_name: Aluno
                        active_status: 1
                        created_at: "2026-07-23 16:30:00"
                      journeys:
                        has_unfinished_journey: true
                        unfinished_journey:
                          id: 5
                          user_id: 1
                          journey_profile_id: 2
                          status: in_progress
                          started_at: "2026-07-24 08:00:00"
                          finished_at: null
                        latest_journey:
                          id: 4
                          user_id: 1
                          journey_profile_id: 2
                          status: completed
                          started_at: "2026-07-23 08:00:00"
                          finished_at: "2026-07-23 09:00:00"
                        recent_journeys: []
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "403":
          description: Conta da sessao atual nao esta ativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Encerra a sessao autenticada
      description: Invalida a sessao atual no backend e regenera o token de sessao. Depois do logout, o cookie anterior nao autentica novas chamadas para /me.
      operationId: logoutUser
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Logout realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              examples:
                loggedOut:
                  value:
                    success: true
                    message: Logout realizado com sucesso.
                    data: null
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "403":
          description: Conta da sessao atual nao esta ativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                accountNotActivated:
                  value:
                    success: false
                    message: Sua conta ainda nao foi ativada por um administrador do sistema.
                    errors: []
                    code: ACCOUNT_NOT_ACTIVATED
  /competencies:
    get:
      tags:
        - Competencies
      summary: Lista competencias
      operationId: listCompetencies
      responses:
        "200":
          description: Lista de competencias cadastradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyListResponse"
    post:
      tags:
        - Competencies
      summary: Cria uma competencia
      operationId: createCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetencyPayload"
            examples:
              privacy:
                value:
                  name: Privacidade de dados
                  description: Conceitos essenciais de protecao de dados pessoais.
      responses:
        "201":
          description: Competencia criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
  /competencies/{id}:
    parameters:
      - $ref: "#/components/parameters/CompetencyId"
    get:
      tags:
        - Competencies
      summary: Busca uma competencia por ID
      operationId: getCompetency
      responses:
        "200":
          description: Competencia encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "404":
          description: Competencia nao encontrada
    put:
      tags:
        - Competencies
      summary: Atualiza uma competencia
      operationId: updateCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetencyPayload"
      responses:
        "200":
          description: Competencia atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetencyResponse"
        "404":
          description: Competencia nao encontrada
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
    delete:
      tags:
        - Competencies
      summary: Remove uma competencia
      operationId: deleteCompetency
      responses:
        "200":
          description: Competencia removida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "404":
          description: Competencia nao encontrada
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: jornada_session
      description: Cookie de sessao HttpOnly emitido pelo backend apos login. Em integracoes browser cross-origin, o frontend deve chamar a API com credenciais habilitadas e a origem precisa estar permitida na configuracao CORS.
  parameters:
    CompetencyId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: jornada-capacitacao-api
    TemplateExampleSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Template endpoint retrieved successfully.
        data:
          $ref: "#/components/schemas/TemplateExample"
    TemplateExample:
      type: object
      required:
        - route_name
        - description
        - request_context
        - layers
        - repository_note
      properties:
        route_name:
          type: string
          example: template-example
        description:
          type: string
          example: Exemplo executavel de endpoint seguindo MVC + Services + Repositories.
        request_context:
          type: string
          example: swagger
        layers:
          type: array
          items:
            $ref: "#/components/schemas/TemplateExampleLayer"
        repository_note:
          type: string
          example: Esta repository retorna dados estaticos para demonstrar a arquitetura sem depender do banco.
    TemplateExampleLayer:
      type: object
      required:
        - layer
        - responsibility
        - put_here
      properties:
        layer:
          type: string
          example: service
        responsibility:
          type: string
          example: Orquestrar regra de negocio.
        put_here:
          type: string
          example: Fluxos, validacoes de dominio, decisoes e chamadas para repositories.
    CompetencyListResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Competencies retrieved successfully.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Competency"
    CompetencyResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Competency retrieved successfully.
        data:
          $ref: "#/components/schemas/Competency"
    EmptySuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Competency deleted successfully.
        data:
          type: "null"
          example: null
    StandardValidationError:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation error.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            include_steps:
              - The include steps field must be true or false.
        code:
          type: string
          example: VALIDATION_ERROR
    StandardError:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred.
        errors:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
          example: {}
        code:
          type: string
          example: ERROR_CODE
    UserRegistrationResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Cadastro realizado com sucesso. Sua conta foi criada, mas ainda precisa ser ativada por um administrador do sistema para permitir o acesso.
        data:
          $ref: "#/components/schemas/RegisteredUser"
    RegisteredUser:
      type: object
      required:
        - id
        - name
        - email
        - organization_company
        - department
        - active_status
        - account_status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          format: email
          example: maria.silva@example.com
        organization_company:
          type: string
          example: Ministerio da Justica
        department:
          type: string
          example: Privacidade
        registration_number:
          type:
            - string
            - "null"
          example: MJ-123
        profile_type_id:
          type:
            - integer
            - "null"
          example: 1
        active_status:
          type: integer
          description: 2 representa conta inativa, pendente de ativacao por administrador.
          example: 2
        account_status:
          type: string
          enum:
            - pending_activation
          example: pending_activation
        created_at:
          type:
            - string
            - "null"
          example: "2026-07-23 16:30:00"
    UserRegistrationPayload:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
        - organization_company
        - department
      properties:
        name:
          type: string
          maxLength: 50
          description: Nome completo, contendo nome e sobrenome.
          example: Maria Silva
        email:
          type: string
          format: email
          maxLength: 100
          example: maria.silva@example.com
        password:
          type: string
          minLength: 8
          maxLength: 100
          format: password
          example: secret123
        password_confirmation:
          type: string
          format: password
          example: secret123
        organization_company:
          type: string
          maxLength: 100
          example: Ministerio da Justica
        department:
          type: string
          maxLength: 100
          example: Privacidade
        registration_number:
          type:
            - string
            - "null"
          maxLength: 50
          example: MJ-123
        profile_type_id:
          type:
            - integer
            - "null"
          example: 1
    LoginResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login realizado com sucesso.
        data:
          $ref: "#/components/schemas/AuthenticatedUser"
    AuthenticatedUserResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Usuario autenticado recuperado com sucesso.
        data:
          $ref: "#/components/schemas/AuthenticatedUser"
    AuthenticatedUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - profile
        - active_status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          format: email
          example: maria.silva@example.com
        role:
          type: string
          enum:
            - common_user
            - administrator
          example: common_user
        profile:
          $ref: "#/components/schemas/AuthenticatedUserProfile"
        active_status:
          type: integer
          description: 1 representa conta ativa.
          example: 1
    AuthenticatedUserProfile:
      type: object
      required:
        - role
        - label
        - user_type_id
        - profile_type_id
        - profile_type_name
      properties:
        role:
          type: string
          enum:
            - common_user
            - administrator
