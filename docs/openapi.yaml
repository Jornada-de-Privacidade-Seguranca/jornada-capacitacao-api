        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJourneyCertificationsPayload"
            examples:
              update:
                value:
                  certification_ids:
                    - 1
                    - 2
                    - 3
              empty:
                value:
                  certification_ids: []
      responses:
        "200":
          description: Certificacoes selecionadas salvas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCertificationSelectionResponse"
              examples:
                updated:
                  value:
                    success: true
                    message: Certificacoes selecionadas salvas com sucesso.
                    data:
                      journey_id: 10
                      status: ongoing
                      is_complete: true
                      certifications:
                        - id: 1
                          name: CIPM
                          issuer: IAPP
                          knowledge_domain:
                            id: 1
                            name_pt: Privacidade
                            name_en: Privacy
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "404":
          description: Nao existe jornada em andamento para este usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "419":
          description: Token CSRF invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                missingCertification:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      certification_ids:
                        - A certificacao profissional informada nao existe.
                    code: VALIDATION_ERROR
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Nao foi possivel atualizar as certificacoes selecionadas no momento.
                    errors: []
                    code: JOURNEY_CERTIFICATIONS_UPDATE_FAILED
  /journeys/current/courses:
    get:
      tags:
        - Journeys
      summary: Consulta os cursos selecionados na jornada em andamento
      description: >-
        Deprecado: o pre-questionario saiu do fluxo da jornada. Esta rota nao e mais exigida pela finalizacao nem entra na nota, e sera removida futuramente.
        Retorna a lista de cursos superiores selecionados na jornada em andamento do usuario autenticado. Retorna uma lista vazia quando ainda nao houver selecao. A resposta nao inclui afinidade, peso ou pontuacao.
      deprecated: true
      operationId: getCurrentJourneyCourses
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Cursos selecionados retornados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCourseOptionListResponse"
              examples:
                empty:
                  value:
                    success: true
                    message: Cursos selecionados encontrados com sucesso.
                    data: []
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Nao existe jornada em andamento para este usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                ongoingJourneyNotFound:
                  value:
                    success: false
                    message: Nao existe jornada em andamento para este usuario.
                    errors: []
                    code: ONGOING_JOURNEY_NOT_FOUND
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    put:
      tags:
        - Journeys
      summary: Substitui os cursos selecionados na jornada em andamento
      description: >-
        Deprecado: o pre-questionario saiu do fluxo da jornada. Esta rota nao e mais exigida pela finalizacao nem entra na nota, e sera removida futuramente.
        Substitui integralmente a selecao em RL_CURSOS_SUPERIORES_JORNADA. IDs duplicados sao normalizados antes da sincronizacao e uma lista vazia remove todas as selecoes.
      deprecated: true
      operationId: replaceCurrentJourneyCourses
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCurrentJourneyCoursesPayload"
            examples:
              default:
                value:
                  course_ids: [1, 2, 3]
              clear:
                value:
                  course_ids: []
      responses:
        "200":
          description: Cursos selecionados substituidos com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCourseOptionListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Nao existe jornada em andamento para este usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          description: Um ou mais cursos nao existem ou o payload e invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /journeys/current/courses/options:
    get:
      tags:
        - Journeys
      summary: Lista cursos academicos disponiveis para a jornada em andamento
      description: >-
        Deprecado: o pre-questionario saiu do fluxo da jornada. Esta rota nao e mais exigida pela finalizacao nem entra na nota, e sera removida futuramente.
        Retorna os cursos superiores cadastrados em TB_CURSO_SUPERIOR disponiveis para selecao na etapa de formacao academica da jornada, usando o relacionamento com TB_SUBCRITERIOS para identificar o tipo do curso quando essa informacao estiver disponivel. Exige que o usuario autenticado possua uma jornada em andamento.
      deprecated: true
      operationId: listJourneyCourseOptions
      security:
        - sessionAuth: []
      parameters:
        - name: type_id
          in: query
          required: false
          description: Filtra os cursos pelo identificador do tipo/subcriterio cadastrado em TB_SUBCRITERIOS. Aceita apenas subcriterios de formacao academica (Graduacao, Pos-Graduacao, Mestrado, Doutorado); um subcriterio existente mas de outra categoria, como experiencia profissional ou ingles, retorna 422 INVALID_COURSE_TYPE.
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: Cursos disponiveis retornados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCourseOptionListResponse"
              examples:
                ok:
                  value:
                    success: true
                    message: Cursos disponiveis encontrados com sucesso.
                    data:
                      - id: 1
                        name_pt: Direito
                        name_en: Law
                        type:
                          id: 1
                          name_pt: Graduação
                          name_en: Bachelor Degree
                      - id: 2
                        name_pt: Ciencia da Computacao
                        name_en: Computer Science
                        type:
                          id: 1
                          name_pt: Graduação
                          name_en: Bachelor Degree
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                unauthenticated:
                  value:
                    success: false
                    message: Usuario nao autenticado.
                    errors: []
                    code: UNAUTHENTICATED
        "404":
          description: Nao existe jornada em andamento para este usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                ongoingJourneyNotFound:
                  value:
                    success: false
                    message: Nao existe jornada em andamento para este usuario.
                    errors: []
                    code: ONGOING_JOURNEY_NOT_FOUND
        "422":
          description: Filtro de tipo de curso invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidType:
                  value:
                    success: false
                    message: Tipo de curso informado e invalido.
                    errors:
                      type_id:
                        - Tipo de curso informado e invalido.
                    code: INVALID_COURSE_TYPE
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
              examples:
                internalServerError:
                  value:
                    success: false
                    message: Nao foi possivel buscar os cursos disponiveis no momento.
                    errors: []
                    code: COURSE_OPTIONS_SEARCH_FAILED
  /journey-profiles:
    parameters:
      - name: page
        in: query
        description: Número da página
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Quantidade de itens por página
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: modality
        in: query
        description: >-
          Filtra os perfis por modalidade. Privacidade retorna perfis dos domínios Privacidade e Conjunta (Privacidade/Segurança).
          Segurança retorna perfis dos domínios Segurança da Informação e Conjunta (Privacidade/Segurança).
          Privacidade/Segurança retorna todos os perfis, sem filtrar por domínio.
        required: false
        deprecated: true
        schema:
          type: string
          enum:
            - Privacidade
            - Segurança
            - Privacidade/Segurança
      - name: domains[]
        in: query
        description: Filtra por um ou mais IDs de domínio do conhecimento.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: user_status[]
        in: query
        description: Filtra por histórico de jornadas do usuário autenticado em cada perfil. completed inclui perfis com ao menos uma jornada concluída, mesmo que exista outra em andamento; pending inclui perfis com jornada em andamento; not_done inclui perfis sem nenhuma jornada. O campo user_status do resultado dá precedência a pending quando existem jornadas em andamento e concluídas; last_score continua vindo da jornada concluída mais recente.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [completed, pending, not_done]
      - name: search
        in: query
        description: Busca por nome ou descrição em português/inglês, sem diferenciar maiúsculas/minúsculas ou acentos.
        required: false
        schema:
          type: string
          maxLength: 255
    get:
      tags:
        - JourneyProfiles
      summary: Lista tipos de jornada
      operationId: listJourneyProfiles
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Lista de tipos de jornada cadastrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProfileListResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "422":
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardValidationError"
              examples:
                invalidPagination:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      page:
                        - A pagina atual deve ser maior ou igual a 1.
                    code: VALIDATION_ERROR
                invalidModality:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      modality:
                        - A modalidade deve ser Privacidade, Segurança ou Privacidade/Segurança.
                    code: VALIDATION_ERROR
                invalidSearch:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      search:
                        - A busca deve ser um texto.
                    code: VALIDATION_ERROR
                invalidDomain:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      domains.0:
                        - Um ou mais dominios informados nao existem.
                    code: VALIDATION_ERROR
                invalidUserStatus:
                  value:
                    success: false
                    message: Validation error.
                    errors:
                      user_status.0:
                        - A situacao deve ser completed, pending ou not_done.
                    code: VALIDATION_ERROR
  /journey-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/JourneyProfileId"
    get:
      tags:
        - JourneyProfiles
      summary: Busca um tipo de jornada por ID
      operationId: getJourneyProfile
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Tipo de jornada encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProfileResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Tipo de jornada nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: jornada_session
      description: Cookie de sessao HttpOnly emitido pelo backend apos login. Em integracoes browser cross-origin, o frontend deve chamar a API com credenciais habilitadas e a origem precisa estar permitida na configuracao CORS.
  responses:
    Unauthenticated:
      description: Usuario nao autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          examples:
            unauthenticated:
              value:
                success: false
                message: Usuario nao autenticado.
                errors: []
                code: UNAUTHENTICATED
    CsrfTokenMismatch:
      description: Token CSRF ausente ou invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          examples:
            csrfTokenMismatch:
              value:
                success: false
                message: Token CSRF invalido.
                errors: []
                code: CSRF_TOKEN_MISMATCH
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Valor retornado em data.csrf_token por GET /auth/csrf-token. No Swagger local, execute primeiro /auth/csrf-token, copie data.csrf_token e cole aqui antes de chamar endpoints mutaveis autenticados por sessao.
      schema:
        type: string
      example: test-csrf-token
    JourneyProfileId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    UserId:
      name: user
      in: path
      required: true
      description: Identificador do usuario associado a operacao.
      schema:
        type: integer
        minimum: 1
      example: 2
    JourneyId:
      name: journey
      in: path
      required: true
      description: Identificador da jornada que sera detalhada.
      schema:
        type: integer
        minimum: 1
      example: 10
  schemas:
    TemplateExampleSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Template endpoint retrieved successfully.
        data:
          $ref: "#/components/schemas/TemplateExample"
    TemplateExample:
      type: object
      required:
        - route_name
        - description
        - request_context
        - layers
        - repository_note
      properties:
        route_name:
          type: string
          example: template-example
        description:
          type: string
          example: Exemplo executavel de endpoint seguindo MVC + Services + Repositories.
        request_context:
          type: string
          example: swagger
        layers:
          type: array
          items:
            $ref: "#/components/schemas/TemplateExampleLayer"
        repository_note:
          type: string
          example: Esta repository retorna dados estaticos para demonstrar a arquitetura sem depender do banco.
    TemplateExampleLayer:
      type: object
      required:
        - layer
        - responsibility
        - put_here
      properties:
        layer:
          type: string
          example: service
        responsibility:
          type: string
          example: Orquestrar regra de negocio.
        put_here:
          type: string
          example: Fluxos, validacoes de dominio, decisoes e chamadas para repositories.
    SystemSummarySuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: System summary retrieved successfully.
        data:
          $ref: "#/components/schemas/SystemSummary"
    SystemSummary:
      type: object
      required:
        - app_name
        - environment
        - database
      properties:
        app_name:
          type: string
          example: Jornada de Capacitacao API
        environment:
          type: string
          example: local
        tag:
          type:
            - string
            - "null"
          example: monitoring
        database:
          $ref: "#/components/schemas/SystemSummaryDatabase"
    SystemSummaryDatabase:
      type: object
      required:
        - competencies_count
      properties:
        competencies_count:
          type: integer
          example: 5
        connected:
          type: boolean
          example: true
        driver:
          type: string
          example: pgsql
    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
        - last_page
        - has_next_page
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 3
        has_next_page:
          type: boolean
          example: true
    EmptySuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logout realizado com sucesso.
        data:
          type: "null"
          example: null
    CsrfTokenResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token CSRF gerado com sucesso.
        data:
          type: object
          required:
            - csrf_token
          properties:
            csrf_token:
              type: string
              example: 6g7XqYcH5q9mKpT3nB2wR8sV1zL0aE4d
    StandardValidationError:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation error.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            include_steps:
              - The include steps field must be true or false.
        code:
          type: string
          example: VALIDATION_ERROR
    StandardError:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred.
        errors:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
          example: {}
        code:
          type: string
          example: ERROR_CODE
    PendingUserActivationListResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Contas pendentes retornadas com sucesso.
        data:
          type: array
          items:
            $ref: "#/components/schemas/PendingUserActivation"
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: "#/components/schemas/PaginationMeta"
    PendingUserActivation:
      type: object
      required:
        - id
        - name
        - email
        - organization
        - department
        - registration_number
        - created_at
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        organization:
          type:
            - string
            - "null"
        department:
          type:
            - string
            - "null"
        registration_number:
          type:
            - string
            - "null"
        created_at:
          type:
            - string
            - "null"
          pattern: '^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$'
          example: "2026-10-20 09:30:00"
    AdministeredUserResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          required:
            - id
            - name
            - email
            - active_status
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
            active_status:
              type: integer
              enum: [0, 1, 2]
    UserRegistrationResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Cadastro realizado com sucesso. Sua conta foi criada, mas ainda precisa ser ativada por um administrador do sistema para permitir o acesso.
        data:
          $ref: "#/components/schemas/RegisteredUser"
    RegisteredUser:
      type: object
      required:
        - id
        - name
        - email
        - organization_company
        - department
        - registration_number
        - profile_type_id
        - journey_profile_id
        - active_status
        - account_status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          format: email
          example: maria.silva@example.com
        organization_company:
          type: string
          example: Secretaria de Governo
        department:
          type: string
          example: Privacidade
        registration_number:
          type: string
          example: MAT-123
        profile_type_id:
          type: integer
          description: Perfil de acesso da conta. No cadastro publico e sempre 3 (Usuario).
          example: 3
        journey_profile_id:
          type:
            - integer
            - "null"
          description: Perfil de jornada selecionado para iniciar a primeira jornada, se ja escolhido no cadastro.
          example: 1
        active_status:
          type: integer
          description: 2 representa conta inativa, pendente de ativacao por administrador.
          example: 2
        account_status:
          type: string
          enum:
            - pending_activation
          example: pending_activation
        created_at:
          type:
            - string
            - "null"
          example: "2026-07-23 16:30:00"
    UpdateOwnProfilePayload:
      type: object
      minProperties: 1
      description: Pelo menos um dos campos editaveis. Campos fora desta lista, como registration_number, sao ignorados.
      properties:
        name:
          type: string
          maxLength: 50
          description: Nome completo, com pelo menos nome e sobrenome.
          example: Maria Souza
        email:
          type: string
          format: email
          maxLength: 100
          example: maria.souza@example.com
        organization:
          type: string
          maxLength: 100
          example: Secretaria de Governo
        department:
          type: string
          maxLength: 100
          example: Seguranca da Informacao
    UserRegistrationPayload:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
        - organization
        - department
        - registration_number
      properties:
        name:
          type: string
          maxLength: 50
          description: Nome completo, com pelo menos nome e sobrenome.
          example: Maria Silva
        email:
          type: string
          format: email
          maxLength: 100
