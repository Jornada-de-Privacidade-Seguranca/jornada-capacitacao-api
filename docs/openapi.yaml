        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentJourneyGeneralDataPayload"
            examples:
              allFields:
                summary: Todos os campos
                value:
                  english_level_id: 10
                  professional_experience_id: 2
                  profile_experience_id: 3
              singleField:
                summary: Um campo isolado
                value:
                  professional_experience_id: 2
              twoFields:
                summary: Mais de um campo (o nao enviado e mantido)
                value:
                  professional_experience_id: 2
                  profile_experience_id: 3
      responses:
        "200":
          description: Dados gerais salvos com sucesso
