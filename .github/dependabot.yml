version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '12:30'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '12:30'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
